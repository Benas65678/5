displayName="Verity: Darkness & Containment"
authors="You"
description='''An addon for The Verity Mod.

A sanity meter that drains in the dark and near anomalies. Sanity Tonics (drink, splash,
lingering), Comfort Cookies, the Smile Charm, the Smile Lamp and the Containment Lantern
refill it and calm Verity. The angrier Verity gets, the stronger it becomes and the more
Anomalies it summons. Forge a Null Blade from Distortion Shards to fight back.'''

